<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Incidente - Gestor de Incidentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/dashboard.css">
</head>
<body class="dashboard">
    <!-- Navbar -->
    <nav class="dashboard-navbar">
        <div class="navbar-content">
            <h2 class="navbar-brand">🚨 Gestor de Incidentes</h2>
            <div class="navbar-menu">
                <a href="dashboard-tecnico.html">Dashboard</a>
                <a href="incident-list-tecnico.html">Meus Incidentes</a>
                <a href="incident-new.html" class="active">Novo Incidente</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <h1>Registar Novo Incidente</h1>
        </div>

        <!-- Form Container -->
        <div class="form-container" style="max-width: 800px; margin: 0 auto;">
            <form id="incidentForm" onsubmit="submitIncident(event)">
                <div class="form-group">
                    <label for="title">Título do Incidente *</label>
                    <input type="text" id="title" name="title" required placeholder="Ex: Email não funciona">
                </div>

                <div class="form-group">
                    <label for="description">Descrição Detalhada *</label>
                    <textarea id="description" name="description" required rows="5" placeholder="Descreva o problema com detalhes..."></textarea>
                </div>

                <div class="form-row">
                <div class="form-group">
                    <label for="category">Categoria *</label>
                    <select id="category" name="category" required>
                        <option value="">Selecione uma categoria</option>
                        <!-- Preenchido dinamicamente por options.js -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Prioridade *</label>
                    <select id="priority" name="priority" required>
                        <option value="">Selecione prioridade</option>
                        <!-- Preenchido dinamicamente por options.js -->
                    </select>
                </div>
                </div>

                <div class="form-group">
                    <label for="affectedUsers">Utilizadores Afetados *</label>
                    <input type="number" id="affectedUsers" name="affectedUsers" required min="1" placeholder="Número de utilizadores afetados">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">✅ Registar Incidente</button>
                    <a href="dashboard-tecnico.html" class="btn-reset">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/main.js"></script>
    <script src="../static/js/api.js"></script>
    <script src="../static/js/options.js"></script>
    <script>
        // Garante que só utilizadores autenticados acedem
        document.addEventListener('DOMContentLoaded', async () => {
            requireAuth();
            // Carregar opções dinamicamente
            await loadOptions();
        });

        async function submitIncident(event) {
            event.preventDefault();

            const user = getCurrentUser();
            if (!user) {
                window.location.href = "../index.html";
                return;
            }

            const title = document.getElementById("title").value.trim();
            const description = document.getElementById("description").value.trim();
            const category = document.getElementById("category").value;
            const priority = document.getElementById("priority").value;
            const affectedUsersValue = document.getElementById("affectedUsers").value;

            const affectedUsers = parseInt(affectedUsersValue, 10);

            // Validações melhoradas
            if (!title || !description || !category || !priority || !affectedUsers || affectedUsers < 1) {
                alert("Preenche todos os campos obrigatórios com valores válidos.");
                return;
            }

            // Validar comprimento do título
            if (title.length < 5) {
                alert("O título deve ter pelo menos 5 caracteres.");
                return;
            }

            if (title.length > 200) {
                alert("O título não pode ter mais de 200 caracteres.");
                return;
            }

            // Validar comprimento da descrição
            if (description.length < 10) {
                alert("A descrição deve ter pelo menos 10 caracteres.");
                return;
            }

            if (description.length > 5000) {
                alert("A descrição não pode ter mais de 5000 caracteres.");
                return;
            }

            // Validar que utilisadores afetados é um número positivo
            if (!Number.isInteger(affectedUsers) || affectedUsers < 1 || affectedUsers > 100000) {
                alert("Número de utilizadores afetados deve estar entre 1 e 100000.");
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/incidents`, {
                    method: "POST",
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        title,
                        description,
                        category,
                        priority,
                        affectedUsers
                    })
                });

                if (!res.ok) {
                    console.error("Erro ao registar incidente", res.status);
                    alert("Erro ao registar incidente.");
                    return;
                }

                const data = await res.json();

                // Determinar qual dashboard mostrar baseado no role do utilizador
                const user = getCurrentUser();
                let dashboardUrl = "dashboard-tecnico.html";
                if (user && user.role === 'gestor') {
                    dashboardUrl = "dashboard-gestor.html";
                } else if (user && user.role === 'sysadmin') {
                    dashboardUrl = "dashboard-sysadmin.html";
                }

                // Adicionar parâmetro para forçar reload dos dados
                const timestamp = new Date().getTime();
                window.location.href = `${dashboardUrl}?reload=${timestamp}&created=true`;
            } catch (err) {
                console.error("Erro no servidor:", err);
                alert("Erro no servidor.");
            }
        }
    </script>
</body>
</html>
